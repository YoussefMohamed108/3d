}
.hero-title em {
  -webkit-text-fill-color: transparent;
  background: linear-gradient(135deg, var(--accent) 0%, #60d8ff 60%, var(--accent2) 100%);
  -webkit-background-clip: text;
  filter: drop-shadow(0 0 16px rgba(56,189,248,.35));
}
.hero-sub { color: rgba(181,199,218,0.82); }
.hero-scroll-line {
  background: linear-gradient(to bottom, var(--accent), rgba(56,189,248,0));
  box-shadow: 0 0 6px rgba(56,189,248,.3);
}

/* ── Buttons — refined ──────────────────────────────────── */
.btn-primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  border-radius: var(--radius-sm);
  box-shadow: 0 0 18px rgba(56,189,248,.28), 0 2px 12px rgba(0,0,0,.3);
  transition: box-shadow 0.3s ease, transform 0.3s var(--easing), background 0.3s ease !important;
  position: relative; overflow: hidden;
}
.btn-primary::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
  pointer-events: none;
}
.btn-primary:hover {
  background: linear-gradient(135deg, #4fc9fc 0%, var(--accent) 100%);
  box-shadow: 0 0 32px rgba(56,189,248,.5), 0 4px 20px rgba(0,0,0,.35);
  transform: translateY(-2px);
}
.btn-ghost {
  border-radius: var(--radius-sm);
  border-color: rgba(56,189,248,0.25);
  backdrop-filter: blur(8px);
  transition: all 0.3s var(--easing);
}
.btn-ghost:hover {
  background: rgba(56,189,248,0.06);
  border-color: var(--accent);
  box-shadow: 0 0 14px rgba(56,189,248,.15);
}

/* ── Marquee — elevated ─────────────────────────────────── */
.marquee-section {
  background: var(--surface);
  border-top: 1px solid var(--glass-border);
  border-bottom: 1px solid var(--glass-border);
  padding: 20px 0;
  position: relative; overflow: hidden;
}
.marquee-section::before,
.marquee-section::after {
  content: '';
  position: absolute; top: 0; bottom: 0;
  width: 120px; z-index: 1;
  pointer-events: none;
}
.marquee-section::before {
  left: 0;
  background: linear-gradient(90deg, var(--surface), transparent);
}
.marquee-section::after {
  right: 0;
  background: linear-gradient(-90deg, var(--surface), transparent);
}
.marquee-track span {
  font-size: 0.95rem;
  color: rgba(181,199,218,0.55);
  letter-spacing: 0.18em;
  transition: color 0.3s;
}
.marquee-track span.accent { color: rgba(56,189,248,0.65); }

/* ── Section typography ─────────────────────────────────── */
.section-eyebrow {
  letter-spacing: 0.46em;
  font-size: 9.5px;
  display: flex; align-items: center; gap: 12px;
}
.section-eyebrow::before {
  content: '';
  display: inline-block; width: 24px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent));
}
.section-title {
  background: linear-gradient(170deg, #ffffff 30%, rgba(255,255,255,0.72) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.section-title em {
  -webkit-text-fill-color: transparent;
  background: linear-gradient(135deg, var(--accent) 0%, #60d8ff 100%);
  -webkit-background-clip: text;
}

/* ── About section ──────────────────────────────────────── */
.about-visual {
  border-radius: var(--radius-card);
  border-color: var(--glass-border);
  background: linear-gradient(145deg, #0d1b2a 0%, #091525 100%);
  box-shadow: 0 0 0 1px var(--glass-border), 0 24px 64px rgba(0,0,0,.5), var(--glow-sm);
  transition: box-shadow 0.5s ease;
}
.about-visual:hover {
  box-shadow: 0 0 0 1px rgba(56,189,248,0.2), 0 32px 80px rgba(0,0,0,.55), var(--glow-md);
}
.about-visual::after {
  background: linear-gradient(145deg, rgba(56,189,248,0.07) 0%, transparent 55%);
  border-radius: var(--radius-card);
}
.about-badge {
  border-radius: 2px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  box-shadow: 0 0 16px rgba(56,189,248,.3);
  font-size: 10px; letter-spacing: 0.24em;
}
.stat-val {
  font-size: 2.8rem;
  background: linear-gradient(170deg, #ffffff 40%, rgba(255,255,255,.65) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stat-val span {
  -webkit-text-fill-color: transparent;
  background: linear-gradient(135deg, var(--accent), #60d8ff);
  -webkit-background-clip: text;
}

/* ── Shop / Product cards ───────────────────────────────── */
#shop { background: linear-gradient(180deg, #0a1520 0%, var(--surface) 100%); }
.products-grid { gap: 3px; }
.product-card {
  border-radius: 0;
  transition: transform 0.45s var(--easing), box-shadow 0.45s ease;
}
.product-card:hover {
  z-index: 2;
  box-shadow: 0 0 0 1px rgba(56,189,248,0.18), 0 20px 50px rgba(0,0,0,.55);
}
.product-img {
  background: linear-gradient(145deg, #0a1827 0%, #0d1e30 100%);
  transition: transform 0.5s var(--easing);
}
.product-overlay {
  background: linear-gradient(to top, rgba(7,17,31,0.95) 0%, rgba(7,17,31,0.2) 60%, transparent 100%);
}
.product-add {
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  box-shadow: 0 0 16px rgba(56,189,248,.3);
  transition: box-shadow 0.3s ease, transform 0.3s var(--easing), background 0.2s !important;
  letter-spacing: 0.18em;
  font-size: 11px;
}
.product-add:hover {
  background: linear-gradient(135deg, #4fc9fc 0%, var(--accent) 100%);
  box-shadow: 0 0 24px rgba(56,189,248,.5);
  transform: translateY(-1px);
}
.product-info {
  border-top: 1px solid var(--glass-border);
  padding: 18px 22px;
  background: linear-gradient(180deg, #09162280 0%, transparent 100%);
}
.product-badge {
  border-radius: 2px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  box-shadow: 0 0 10px rgba(56,189,248,.3);
  letter-spacing: 0.18em;
  font-size: 8.5px;
}
.product-name {
  letter-spacing: 0.08em;
  background: linear-gradient(170deg, #ffffff 30%, rgba(255,255,255,.78) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.product-tag { letter-spacing: 0.28em; }

/* ── Filter chips ───────────────────────────────────────── */
.filter-chip {
  border-radius: var(--radius-sm);
  transition: background-color 0.25s var(--easing), border-color 0.25s var(--easing), color 0.25s var(--easing);
  -webkit-tap-highlight-color: transparent;
}
.filter-chip.active {
  background: rgba(56,189,248,0.10);
  box-shadow: 0 0 10px rgba(56,189,248,.12);
}
@media (hover: hover) and (pointer: fine) {
  .filter-chip:hover {
    background: rgba(56,189,248,0.10);
    box-shadow: 0 0 10px rgba(56,189,248,.12);
  }
}

/* ── Shop grid pagination arrows ────────────────────────── */
.shop-pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 32px;
}
.shop-page-arrow {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--white);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .2s, background .2s, opacity .2s;
}
.shop-page-arrow:hover:not(:disabled) {
  border-color: var(--accent);
  background: rgba(56,189,248,.08);
}
.shop-page-arrow:disabled {
  opacity: .3;
  cursor: default;
}
.shop-page-indicator {
  font-size: 12px;
  letter-spacing: .12em;
  color: var(--muted);
  min-width: 48px;
  text-align: center;
}

/* ── Shop icon button next to the "Shop" nav link ───────── */
.shop-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 0;
  transition: color .2s, transform .2s;
}
.shop-icon-btn:hover { color: var(--accent); transform: scale(1.1); }
.shop-icon-btn svg { width: 100%; height: 100%; }
.nav-shop-item { display: inline-flex; align-items: center; gap: 7px; }

/* ── Full "All Products" shop page ──────────────────────── */
#shop-page-overlay {
  position: fixed; inset: 0; z-index: 550;
  background: var(--bg);
  display: none; flex-direction: column;
  opacity: 0; transition: opacity .3s ease;
  overflow-y: auto;
}
#shop-page-overlay.open { display: flex; }
#shop-page-overlay.visible { opacity: 1; }
.shop-page-topbar {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px clamp(20px, 4vw, 48px);
  background: rgba(7,17,31,.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.shop-page-topbar h2 {
  font-family: var(--font-display);
  font-size: 1.6rem;
  letter-spacing: .06em;
  color: var(--white);
}
.shop-page-close-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(13,27,42,.8); border: 1px solid var(--glass-border);
  color: var(--white); font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .2s, border-color .2s;
}
.shop-page-close-btn:hover { background: var(--accent); border-color: var(--accent); }
.shop-page-body { padding: 28px clamp(20px, 4vw, 48px) 80px; }

/* ── "Added to cart" toast ──────────────────────────────── */
#add-to-cart-toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  z-index: 900;
  display: flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  padding: 13px 22px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .02em;
  box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.08);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  max-width: 90vw;
}
#add-to-cart-toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#add-to-cart-toast .cart-toast-check {
  width: 18px; height: 18px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.25);
  border-radius: 50%;
  font-size: 11px; line-height: 1;
}
#add-to-cart-toast .cart-toast-name {
  font-weight: 600;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ── Process section ────────────────────────────────────── */
.process-grid {
  border-color: var(--glass-border);
  border-radius: var(--radius-card);
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,.4);
  gap: 1px;
}
.process-item {
  background: linear-gradient(145deg, #09162280 0%, #07111f 100%);
  padding: 52px 44px;
  transition: background 0.4s ease;
  border-radius: 0;
}
.process-item:hover {
  background: linear-gradient(145deg, rgba(56,189,248,0.06) 0%, #09162290 100%);
}
.process-item::before {
  color: rgba(56,189,248,0.08);
  font-size: 6rem;
}
.process-item::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(56,189,248,.15), transparent);
}
.process-icon svg path, .process-icon svg rect,
.process-icon svg circle, .process-icon svg line,
.process-icon svg polygon {
  transition: all 0.3s ease;
}
.process-item:hover .process-icon svg [stroke="#e8763a"] {
  stroke: var(--accent);
  filter: drop-shadow(0 0 4px rgba(56,189,248,.4));
}
.process-item:hover .process-icon svg [fill="#e8763a"] {
  fill: var(--accent);
}
.process-name {
  background: linear-gradient(170deg, #ffffff 40%, rgba(255,255,255,.7) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

/* ── Custom / Form section ──────────────────────────────── */
.form-field label {
  letter-spacing: 0.36em;
  font-size: 9.5px;
}
.form-field input,
.form-field select,
.form-field textarea {
  border-radius: var(--radius-sm);
  background: rgba(13,27,42,0.6);
  border-color: rgba(29,59,99,0.7);
  transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
}
.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus {
  border-color: rgba(56,189,248,0.6);
  box-shadow: 0 0 0 3px rgba(56,189,248,.08), 0 0 12px rgba(56,189,248,.1);
  background: rgba(13,27,42,0.8);
}
.form-field select option { background: #0a1525; }

/* ── Footer ─────────────────────────────────────────────── */
footer {
  background: linear-gradient(180deg, #0a1520 0%, #07101e 100%);
  border-top: 1px solid var(--glass-border);
}
.footer-col-title { letter-spacing: 0.36em; font-size: 9.5px; }
.footer-links a {
  transition: color 0.25s ease, padding-left 0.25s var(--easing);
  display: inline-block;
}
.footer-links a:hover {
  color: var(--white);
  padding-left: 6px;
}
.footer-bottom { border-top-color: var(--glass-border); }
.footer-socials a {
  transition: color 0.25s ease;
  position: relative;
}
.footer-socials a::after {
  content: '';
  position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s var(--easing);
}
.footer-socials a:hover::after { transform: scaleX(1); }

/* ── Scroll reveal — smoother ───────────────────────────── */
.reveal {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.75s var(--easing), transform 0.75s var(--easing);
}
.js-pending .reveal { opacity: 0; transform: translateY(24px); }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ── Cart panel ─────────────────────────────────────────── */
.cart-drawer {
  background: linear-gradient(180deg, #0d1e30 0%, #0a1827 100%);
  border-left-color: var(--glass-border);
  box-shadow: -20px 0 60px rgba(0,0,0,.5);
}
.cart-backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
.cart-header { border-bottom-color: var(--glass-border); }
.cart-header h3 {
  background: linear-gradient(170deg, #ffffff 40%, rgba(255,255,255,.75) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.cart-item {
  border-radius: var(--radius-sm);
  border-color: var(--glass-border);
  background: rgba(7,17,31,0.7);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.cart-item:hover {
  border-color: rgba(56,189,248,0.2);
  box-shadow: 0 0 12px rgba(56,189,248,.06);
}
.cart-item-img {
  border-radius: var(--radius-sm);
  border-color: var(--glass-border);
  background: linear-gradient(145deg, #091525 0%, #0d1e30 100%);
}
.cart-qty button {
  border-radius: 2px;
  transition: border-color 0.2s, background 0.2s;
}
.cart-qty button:hover {
  border-color: var(--accent);
  background: rgba(56,189,248,0.08);
}
.cart-footer { border-top-color: var(--glass-border); background: rgba(7,17,31,0.9); }
.cart-checkout-btn {
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  box-shadow: 0 0 16px rgba(56,189,248,.25);
  transition: box-shadow 0.3s ease, transform 0.3s var(--easing), opacity 0.2s;
}
.cart-checkout-btn:hover:not(:disabled) {
  box-shadow: 0 0 28px rgba(56,189,248,.45);
  transform: translateY(-1px);
}
.cart-badge {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  box-shadow: 0 0 8px rgba(56,189,248,.4);
  font-size: 9px;
}
.cart-item-remove:hover { color: #ff8080; }

/* ── Auth modal ─────────────────────────────────────────── */
.auth-box {
  border-radius: var(--radius-card);
  border-color: var(--glass-border);
  background: linear-gradient(145deg, #0e1f30 0%, #0a1827 100%);
  box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 1px var(--glass-border), var(--glow-sm);
}
.auth-tabs { border-bottom-color: var(--glass-border); }
.auth-tab { transition: color 0.2s, border-color 0.2s; }
.auth-field input {
  border-radius: var(--radius-sm);
  border-color: var(--glass-border);
  background: rgba(7,17,31,0.8);
  transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
}
.auth-field input:focus {
  border-color: rgba(56,189,248,0.5);
  box-shadow: 0 0 0 3px rgba(56,189,248,.07), 0 0 12px rgba(56,189,248,.1);
  background: rgba(7,17,31,0.95);
}
.auth-submit {
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  box-shadow: 0 0 14px rgba(56,189,248,.22);
  transition: box-shadow 0.3s, transform 0.3s var(--easing);
}
.auth-submit:hover {
  background: linear-gradient(135deg, #4fc9fc 0%, var(--accent) 100%);
  box-shadow: 0 0 24px rgba(56,189,248,.4);
  transform: translateY(-1px);
}

/* ── Admin panel — polished ─────────────────────────────── */
.admin-header {
  background: rgba(7,17,31,0.96);
  backdrop-filter: blur(20px) saturate(160%);
  border-bottom-color: var(--glass-border);
  box-shadow: 0 1px 0 var(--glass-border), 0 8px 32px rgba(0,0,0,.4);
}
.admin-card {
  border-radius: var(--radius-card);
  border-color: var(--glass-border);
  background: linear-gradient(145deg, #0e1f30 0%, #0a1827 100%);
  transition: box-shadow 0.3s ease, transform 0.3s var(--easing), border-color 0.3s;
}
.admin-card:hover {
  border-color: rgba(56,189,248,0.2);
  box-shadow: 0 0 0 1px rgba(56,189,248,.12), 0 12px 40px rgba(0,0,0,.4);
  transform: translateY(-2px);
}
.admin-btn {
  border-radius: var(--radius-sm);
  transition: all 0.25s var(--easing);
}
.admin-btn:hover { background: rgba(56,189,248,.06); box-shadow: 0 0 10px rgba(56,189,248,.1); }
.admin-btn.primary {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  box-shadow: 0 0 12px rgba(56,189,248,.22);
}
.admin-btn.primary:hover { box-shadow: 0 0 20px rgba(56,189,248,.4); }
.admin-form-box {
  border-radius: var(--radius-card);
  border-color: var(--glass-border);
  background: linear-gradient(145deg, #0e1f30 0%, #0a1827 100%);
  box-shadow: 0 40px 80px rgba(0,0,0,.6), var(--glow-sm);
}

/* ── Payment overlay ────────────────────────────────────── */
.payment-box {
  border-radius: var(--radius-card);
  border-color: var(--glass-border);
  background: linear-gradient(145deg, #0e1f30 0%, #0a1827 100%);
  box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 1px var(--glass-border), var(--glow-sm);
}
.payment-box h2 {
  background: linear-gradient(170deg, #ffffff 40%, rgba(255,255,255,.75) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.pay-method {
  border-radius: var(--radius-sm);
  border-color: var(--glass-border);
  background: rgba(7,17,31,0.7);
  transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, transform 0.25s var(--easing);
}
.pay-method:hover {
  border-color: rgba(56,189,248,0.4);
  background: rgba(56,189,248,0.06);
  box-shadow: 0 0 14px rgba(56,189,248,.12);
  transform: translateX(3px);
}
.pay-method.selected {
  border-color: var(--accent);
  background: rgba(56,189,248,0.1);
  box-shadow: 0 0 0 1px var(--accent), 0 0 14px rgba(56,189,248,.18);
}
.pay-method-radio {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.2s;
}
.pay-method.selected .pay-method-radio { border-color: var(--accent); }
.pay-method.selected .pay-method-radio::after {
  content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
}

/* ── Address fields in payment ───────────────────────────── */
#buyer-address, #buyer-city, #buyer-notes {
  border-radius: var(--radius-sm) !important;
  background: rgba(7,17,31,0.8) !important;
  transition: border-color 0.25s, box-shadow 0.25s !important;
}
#buyer-address:focus, #buyer-city:focus, #buyer-notes:focus {
  box-shadow: 0 0 0 3px rgba(56,189,248,.08), 0 0 12px rgba(56,189,248,.1) !important;
}

.confirm-order-btn {
  width: 100%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #07111f;
  border: none;
  padding: 15px 20px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .15em;
  text-transform: uppercase;
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-top: 20px;
  transition: opacity .2s, transform .2s;
}
.confirm-order-btn:hover { opacity: .9; transform: translateY(-1px); }

<style id="mobile-smoothness">
  /* Global touch/scroll feel */
  html {
    -webkit-text-size-adjust: 100%;

  }
  body {
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: none;
    touch-action: manipulation;
  }
  /* Remove the gray flash/outline on tap for all interactive elements */
  a, button, input, textarea, select, .btn, [onclick] {
    -webkit-tap-highlight-color: transparent;
  }
  /* Any internal scroll container should glide, not jump */
  [style*="overflow-y"], [style*="overflow-x"], .lightbox-sidebar,

  .cart-items, .cart-panel, .admin-panel, .admin-content {

  @media (max-width: 768px) {
    /* Prevent iOS auto-zoom-on-focus: any text input under 16px gets
       bumped to 16px purely for mobile, layout untouched otherwise */
    input, textarea, select {

    }

    button, .btn, a.nav-cta, [onclick] {

    handleModalKeydown(event) {
      const modal = document.getElementById('add-product-modal');
      if (event.key === 'Escape') { event.preventDefault(); this.closeAddForm(); return; }
      if (event.key !== 'Tab') return;
      const focusable = [...modal.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
        .filter(el => el.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    },

    async addVoucher() {
      const codeInput   = document.getElementById('new-voucher-code');
      const typeSelect  = document.getElementById('new-voucher-type');
      const valueInput  = document.getElementById('new-voucher-value');
      const expiresInput = document.getElementById('new-voucher-expires');

      const code  = ((codeInput && codeInput.value) || '').trim().toUpperCase();
      const type  = (typeSelect && typeSelect.value) || 'percent';
      const value = parseFloat(valueInput && valueInput.value);
      const expires = (expiresInput && expiresInput.value) || null;

      if (!code) return alert('Please enter a voucher code.');
      if (isNaN(value) || value <= 0) return alert('Please enter a valid discount value.');
      if (type === 'percent' && value > 100) return alert('Percent discount cannot exceed 100.');

      try {
        await Store.addVoucher({
          code,
          discount_type: type,
          discount_value: value,
          expires_at: expires || null,
          active: true
        });
        if (codeInput) codeInput.value = '';
        if (valueInput) valueInput.value = '';
        if (expiresInput) expiresInput.value = '';
        await this.loadVouchers();
      } catch (e) {
        alert('Error creating voucher: ' + (e.message || 'It may already exist.'));
      }
    },

    async saveProduct(e) {
      e.preventDefault();
      const submitBtn = e.target.querySelector('[type="submit"]');
      submitBtn.textContent = 'Saving…';
      submitBtn.disabled    = true;

      try {
        const salePriceRaw = document.getElementById('ap-sale-price').value;
        const selectedCategories = Array.from(document.querySelectorAll('#ap-categories .ap-category-checkbox:checked'))
          .map(cb => cb.value);
        if (!selectedCategories.length) {
          alert('Please select at least one category.');
          submitBtn.textContent = 'Save Product';
          submitBtn.disabled    = false;
          return;
        }
        const product = {
          name:     document.getElementById('ap-name').value.trim(),
          price:    parseFloat(document.getElementById('ap-price').value),
          category: selectedCategories[0],   // kept for backward-compat with older queries/filters
          categories: selectedCategories,    // full multi-category list
          class:    document.getElementById('ap-class').value,
          badge:    document.getElementById('ap-badge').value.trim(),
          description: document.getElementById('ap-description').value.trim() || null,
          sale_price: salePriceRaw !== '' ? parseFloat(salePriceRaw) : null,
          color:    document.getElementById('ap-color').value.trim(),
          colors:   this.collectColors('ap-colors-list'),
          sizes:    this.collectSizes('ap-sizes-list'),
          svg_key:  'default'
        };

        const saved = await Store.addProduct(product);

        // Upload cover image if selected
        const imgInput = document.getElementById('ap-image');
        if (imgInput && imgInput.files[0]) {
          const file = imgInput.files[0];
          const { publicUrl, path } = await Store.uploadProductImage(file, saved.id);
          await Store.updateProduct(saved.id, { image_url: publicUrl, image_path: path });
        }

        // Upload gallery images if selected
        const galleryInput = document.getElementById('ap-gallery');
        if (galleryInput && galleryInput.files.length > 0) {
          const galleryUrls  = [];
          const galleryPaths = [];
          for (let i = 0; i < galleryInput.files.length; i++) {
            const file = galleryInput.files[i];
            const { publicUrl, path } = await Store.uploadGalleryImage(file, saved.id, i);
            galleryUrls.push(publicUrl);
            galleryPaths.push(path);
          }
          if (galleryUrls.length) {
            await Store.updateProduct(saved.id, { gallery_urls: galleryUrls, gallery_paths: galleryPaths });
          }
        }

        this.closeAddForm();
        e.target.reset();
        await this.render();
        collectionApp._products = (await Store.getProducts()).filter(p => !p.hidden);
        collectionApp._renderMainGrid();
        this.notify('New product added successfully.');
      } catch (err) {
        alert('Error saving product: ' + err.message);
      } finally {
        submitBtn.textContent = 'Save Product';
        submitBtn.disabled    = false;
      }
    }
  };

  const heroSlider = (() => {
    let slides = [];    // array of { id, url, sort_order, path }

    // ── Supabase helpers ──────────────────────────────────
    async function fetchSlides() {

        .from('hero_slides')
        .select('*')
        .order('sort_order', { ascending: true });
      if (error) { console.warn('hero_slides fetch:', error.message); return []; }

    async function uploadSlide(file, order) {
      await validateImageFile(file);
      const { publicUrl, path } = await PrintXMedia.upload(_sb, file, 'hero');
      const { error } = await _sb.from('hero_slides').insert([{ url: publicUrl, path, sort_order: order }]);
      if (error) throw error;

    async function deleteSlide(id, path) {

      await _sb.from('hero_slides').delete().eq('id', id);
    }

    // ── DOM helpers ───────────────────────────────────────
    function setSlideSource(img) {
      if (!img || img.src || !img.dataset.src) return;
      img.src = img.dataset.src;
      if (img.dataset.srcset) img.srcset = img.dataset.srcset;
      delete img.dataset.src;
      delete img.dataset.srcset;
    }

    function prepareSlide(img, url, index) {
      const widths = [360, 640, 960];
      // Hero images use JPEG deliberately. Older Safari versions can fail to
      // paint an automatically negotiated WebP/AVIF image inside this layered
      // carousel even though the request itself succeeds.
      const src = optimizedImageUrl(url, 640, 72, 'contain', 'jpg');
      const srcset = widths.map(width => `${optimizedImageUrl(url, width, 72, 'contain', 'jpg')} ${width}w`).join(', ');
      img.decoding = 'async';
      img.loading = index === 0 ? 'eager' : 'lazy';
      img.fetchPriority = index === 0 ? 'high' : 'low';
      img.sizes = '(max-width: 600px) 70vw, (max-width: 1100px) 30vw, 38vw';
      if (index === 0) {
        img.src = src;
        img.srcset = srcset;
      } else {
        img.dataset.src = src;
        img.dataset.srcset = srcset;
      }
    }

    function buildDom() {
      const container = document.getElementById('hero-slides');
      const dotsEl    = document.getElementById('slider-dots');
      if (!container || !dotsEl) return;

      container.innerHTML = '';
      dotsEl.innerHTML = '';

      if (slides.length === 0) {
        // Fallback to local 1.jpeg
        const img = document.createElement('img');
        img.className = 'hero-slide active';
        img.src = '1.jpeg';
        img.alt = 'PrintX Featured Figure';
        container.appendChild(img);
        document.getElementById('hero-slider').classList.add('single');
        return;
      }

      const sliderEl = document.getElementById('hero-slider');
      sliderEl.classList.toggle('single', slides.length === 1);

      slides.forEach((s, i) => {
        const img = document.createElement('img');
        img.className = 'hero-slide' + (i === 0 ? ' active' : '');
        prepareSlide(img, s.url, i);
        img.alt = 'PrintX Featured Figure';
        container.appendChild(img);

        const dot = document.createElement('span');
        dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => goTo(i);
        dotsEl.appendChild(dot);
      });

      current = 0;
      const warmNext = () => setSlideSource(container.querySelectorAll('.hero-slide')[1]);
      if ('requestIdleCallback' in window) requestIdleCallback(warmNext, { timeout: 1800 });
      else setTimeout(warmNext, 700);
    }

    function goTo(idx) {
      const imgs = document.querySelectorAll('.hero-slide');
      const dots = document.querySelectorAll('.hero-dot');
      if (!imgs.length) return;
      if (imgs[current]) imgs[current].classList.remove('active');
      if (dots[current]) dots[current].classList.remove('active');
      current = (idx + slides.length) % (slides.length || 1);
      setSlideSource(imgs[current]);
      setSlideSource(imgs[(current + 1) % imgs.length]);
      if (imgs[current]) imgs[current].classList.add('active');
      if (dots[current]) dots[current].classList.add('active');
    }

    function startAuto() {
      clearInterval(timer);
      if (slides.length > 1 && !document.hidden) timer = setInterval(() => goTo(current + 1), 4000);
    }

    // ── Admin UI ──────────────────────────────────────────
    function renderAdminList() {
      const list = document.getElementById('hero-slides-list');
      if (!list) return;
      if (slides.length === 0) {
        list.innerHTML = '<p style="color:var(--muted);font-size:13px;">No slides yet — upload images below.</p>';
        return;
      }
      list.innerHTML = slides.map((s, i) => `
        <div style="position:relative;width:100px;flex-shrink:0;">
          <img src="${escapeHtml(s.url)}" alt="Slide ${i+1}" loading="lazy" decoding="async"
            style="width:100px;height:130px;object-fit:cover;border:2px solid var(--border);border-radius:4px;display:block;" />
          <div style="position:absolute;top:4px;left:4px;background:rgba(7,17,31,.8);
               color:var(--accent);font-size:10px;padding:2px 6px;border-radius:2px;">#${i+1}</div>
          <button ${actionAttr('heroSlider.adminDelete', s.id, s.path)}
            style="position:absolute;top:4px;right:4px;background:#ff6b6b;color:#fff;
                   border:none;width:22px;height:22px;border-radius:50%;cursor:pointer;
                   font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;">✕</button>
        </div>`).join('');
    }

    // ── Public API ────────────────────────────────────────
    return {
      async init() {
        // Wire buttons
        const previous = document.getElementById('slider-prev');
        const next = document.getElementById('slider-next');
        if (previous) previous.addEventListener('click', () => { goTo(current - 1); clearInterval(timer); startAuto(); });
        if (next) next.addEventListener('click', () => { goTo(current + 1); clearInterval(timer); startAuto(); });
        document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(timer) : startAuto());

        slides = await fetchSlides();
        buildDom();
        startAuto();
      },

      async adminRefresh() {
        slides = await fetchSlides();
        buildDom();
        startAuto();
        renderAdminList();
      },

      async adminUpload() {
        const input  = document.getElementById('hero-slide-file');
        const status = document.getElementById('hero-slide-status');
        if (!input.files.length) { alert('Please select at least one image.'); return; }
        status.style.display = 'block';
        status.textContent = 'Uploading…';
        let baseOrder = slides.length;
        try {
          for (const file of Array.from(input.files)) {
            await uploadSlide(file, baseOrder++);
          }
          input.value = '';
          status.textContent = '✓ Uploaded successfully!';
          setTimeout(() => { status.style.display = 'none'; }, 3000);
          await this.adminRefresh();
        } catch(e) {
          status.style.color = '#ff6b6b';
          status.textContent = '✕ Upload failed: ' + (e.message || JSON.stringify(e));
        }
      },

      async adminDelete(id, path) {
        if (!confirm('Remove this slide from the hero slideshow?')) return;
        const status = document.getElementById('hero-slide-status');
        status.style.display = 'block';
        status.style.color = 'var(--accent)';
        status.textContent = 'Removing…';
        try {
          await deleteSlide(id, path);
          status.textContent = '✓ Slide removed.';
          setTimeout(() => { status.style.display = 'none'; }, 2500);
          await this.adminRefresh();
        } catch(e) {
          status.style.color = '#ff6b6b';
          status.textContent = '✕ Error: ' + (e.message || JSON.stringify(e));
        }
      },

      // Called by adminApp when opening admin panel
      openAdmin() { renderAdminList(); }
    };
  })();

  document.addEventListener('DOMContentLoaded', async () => {
    cartApp.init();
    // These startup requests do not depend on one another. Run them together
    // so authentication and settings cannot block the public catalog.
    const paymentNumbersInit = Store.getPaymentNumbers()
      .then(nums => paymentUI.updateNumbers(nums, { instapay: '011 2560 7937', ewallet: '011 2560 7937' }))
      .catch(e => console.warn('Payment numbers init:', e));
    // Promise.allSettled is unavailable on older iOS Safari. Convert each
    // startup task to a resolved promise so one failure cannot hide the rest.
    const settle = promise => Promise.resolve(promise).catch(error => {
      console.warn('Startup task:', error);
      return null;
    });
    await Promise.all([
      settle(authApp.init()),
      settle(collectionApp.init()),
      settle(heroSlider.init()),
      settle(paymentNumbersInit)
    ]);

    // Detect Supabase email confirmation redirect (hash contains type=signup or type=email)
    const hash = window.location.hash;
    if (hash && (hash.includes('type=signup') || hash.includes('type=email'))) {
      // Let Supabase process the session first, then show the overlay
      setTimeout(() => window._showAccountConfirmed(), 600);
    }
    // Also catch onAuthStateChange EMAIL_CONFIRMED event (Supabase v2 PKCE flow)
    _sb.auth.onAuthStateChange((event) => {
      if (event === 'USER_UPDATED' || event === 'SIGNED_IN') {
        const h = window.location.hash;
        if (h && (h.includes('type=signup') || h.includes('type=email'))) {
          window._showAccountConfirmed();
        }
      }
    });
  });
</script>

<script id="shop-page-script">
  const shopPage = {
    search: '',
    mainFilter: new Set(),

    open() {
      // Reuse the products/categories already loaded by collectionApp so
      // this page always matches the homepage catalog with no extra fetch.
      this.search = '';
      this.mainFilter = new Set();
      const searchInput = document.getElementById('shop-page-search-input');
      if (searchInput) searchInput.value = '';
      const overlay = document.getElementById('shop-page-overlay');
      overlay.scrollTop = 0;
      requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('open', 'visible')));
      document.body.style.overflow = 'hidden';
      this._renderFilterBar();
      this._renderGrid();
    },

    close() {
      const overlay = document.getElementById('shop-page-overlay');
      overlay.classList.remove('visible');
      setTimeout(() => {
        overlay.classList.remove('open');
        overlay.style.display = '';
        document.body.style.overflow = '';
        // Drop the rendered cards once fully closed so their image
        // elements and reveal-observer entries don't keep sitting around
        // in memory / getting checked on every scroll of the main page.
        const grid = document.getElementById('shop-page-grid');
        if (grid) grid.innerHTML = '';
      }, 300);
    },

    setSearch(value) {
      this.search = value || '';
      this._renderGrid();
    },

    setFilter(filter) {
      if (filter === 'All') {
        this.mainFilter.clear();
      } else if (this.mainFilter.has(filter)) {
        this.mainFilter.delete(filter);
      } else {
        this.mainFilter.add(filter);
      }
      this._renderFilterBar();
      this._renderGrid();
    },

    _renderFilterBar() {
      const bar = document.getElementById('shop-page-filter-bar');
      if (!bar) return;
      const cats = collectionApp._categories.map(c => c.name);
      const allActive = this.mainFilter.size === 0;
      bar.innerHTML = `<button class="filter-chip${allActive ? ' active' : ''}" data-filter="All"
          onclick="shopPage.setFilter('All')">${t('filterAll')}</button>` +
        cats.map(cat =>
          `<button class="filter-chip${this.mainFilter.has(cat) ? ' active' : ''}" data-filter="${cat}"
            onclick="shopPage.setFilter('${cat.replace(/'/g, "\\'")}')">
            ${cat}
          </button>`
        ).join('');
    },

    _renderGrid() {
      const grid = document.getElementById('shop-page-grid');
      const countEl = document.getElementById('shop-page-count');
      if (!grid) return;
      const products = collectionApp._products;
      let filtered = this.mainFilter.size === 0
        ? products
        : products.filter(p => getProductCategories(p).some(c => this.mainFilter.has(c)));
      const q = (this.search || '').trim().toLowerCase();
      if (q) {
        filtered = filtered.filter(p => {
          const name = (p.name || '').toLowerCase();
          const desc = (p.description || '').toLowerCase();
          const cats = getProductCategories(p).join(' ').toLowerCase();
          const cls = (p.class || '').toLowerCase();
          return name.includes(q) || desc.includes(q) || cats.includes(q) || cls.includes(q);
        });
      }
      filtered = sortProductsForDisplay(filtered);

      if (countEl) countEl.textContent = `${filtered.length} ${filtered.length === 1 ? t('figureSingular') : t('figurePlural')}`;
      if (!filtered.length) {
        grid.innerHTML = `<p style="color:var(--muted);text-align:center;padding:40px;grid-column:1/-1;">${q ? t('noProductsMatchSearch').replace('%s', escapeHtml(this.search)) : t('noProductsCategory')}</p>`;
        return;
      }
      grid.innerHTML = filtered.map((p, idx) => collectionApp._cardHTML(p, idx % 3 === 0 ? '' : `reveal-delay-${idx % 3}`, idx < 2)).join('');
      // Cards are already on-screen the moment the overlay opens, so just
      // show them directly instead of registering them with the
      // scroll-triggered reveal observer (which is meant for the
      // homepage's long scrolling sections, not a full-screen overlay).
      grid.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
      grid.querySelectorAll('.product-add').forEach(btn => {
        const id = btn.dataset.id;
        const product = products.find(x => x.id === id);
        if (product) btn.onclick = () => {
          // Products with color and/or size options need the customer to
          // pick a variant before we add to cart, so route those through
          // the product lightbox instead of adding blindly.
          if ((product.colors && product.colors.length) || (product.sizes && product.sizes.length)) {
            productGallery.open(product);
          } else {
            cartApp.add(product);
          }
        };
      });
      grid.querySelectorAll('.product-card').forEach(card => {
        card.addEventListener('click', e => {
          if (e.target.classList.contains('product-add')) return;
          const id = card.dataset.pid;
          const product = products.find(x => x.id === id);
          if (product) productGallery.open(product);
        });
      });
    }
  };

  // Close on backdrop click (clicking the empty area outside the body content)
  document.getElementById('shop-page-overlay').addEventListener('click', function(e) {
    if (e.target === this) shopPage.close();
  });
</script>

<script id="gallery-lightbox-script">
  const productGallery = {
    _product: null,
    _allImages: [],
    _current: 0,

    open(product) {
      this._product = product;
      this._selectedColorIndex = (product.colors && product.colors.length === 1) ? 0 : null;
      this._selectedSizeIndex = (product.sizes && product.sizes.length === 1) ? 0 : null;
      // Build image list: cover + gallery
      const imgs = [];
      if (product.image_url) imgs.push(product.image_url);
      if (product.gallery_urls && product.gallery_urls.length) {
        imgs.push(...product.gallery_urls);
      }
      if (!imgs.length) {
        imgs.push('__SVG__');
      }
      this._allImages = imgs;
      this._current   = 0;

      // Render info
      const onSale = product.sale_price != null && product.sale_price !== '' && parseFloat(product.sale_price) < parseFloat(product.price);
      const autoSelectedSize = (this._selectedSizeIndex != null && product.sizes) ? product.sizes[this._selectedSizeIndex] : null;
      const priceHTML = (autoSelectedSize && Number.isFinite(parseFloat(autoSelectedSize.price)))
        ? `<strong>EGP ${parseFloat(autoSelectedSize.price).toFixed(2)}</strong>`
        : onSale
          ? `<span style="text-decoration:line-through;color:var(--muted);margin-right:8px;font-size:.85em;">EGP ${parseFloat(product.price).toFixed(2)}</span><strong style="color:var(--accent);">EGP ${parseFloat(product.sale_price).toFixed(2)}</strong>`
          : `<strong>EGP ${product.price}</strong>`;
      const descHTML = product.description
        ? `<div class="lb-description" style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px;">${escapeHtml(product.description)}</div>`
        : '';
      // Color swatches are clickable — the customer must pick one (when
      // the product has colors) before Add to Cart will work, and the
      // chosen color travels with the cart line item to checkout/orders.
      const colorsHTML = (product.colors && product.colors.length)
        ? `<div style="margin-bottom:16px;" id="lb-colors">
             <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">${t('availableColors')}</div>
             <div style="display:flex;gap:10px;flex-wrap:wrap;" id="lb-colors-list">
               ${product.colors.map((c, i) => `
                 <button type="button" aria-pressed="${i === this._selectedColorIndex}" title="${escapeHtml(c.name||'')}" data-color-idx="${i}" onclick="productGallery.selectColor(${i})"
                      style="display:flex;align-items:center;gap:6px;cursor:pointer;
                      background:rgba(56,189,248,.06);border:1px solid ${i === this._selectedColorIndex ? 'var(--accent)' : 'var(--glass-border)'};border-radius:20px;
                      padding:4px 10px 4px 4px;transition:border-color .15s;">
                   <span style="width:18px;height:18px;border-radius:50%;border:1px solid var(--border);
                         background:${(c.hex||'#c8763a').replace(/[^#a-zA-Z0-9]/g,'')};display:inline-block;"></span>
                   <span style="font-size:12px;color:var(--muted);">${escapeHtml(c.name)}</span>
                 </button>`).join('')}
             </div>
             <div id="lb-color-error" style="display:none;color:#ff6b6b;font-size:12px;margin-top:8px;">⚠ Please choose a color before adding to cart.</div>
           </div>`
        : '';
      // Size options work the same way as colors: pick one before Add to
      // Cart works, and the chosen size travels with the cart line item.
      const sizesHTML = (product.sizes && product.sizes.length)
        ? `<div style="margin-bottom:16px;" id="lb-sizes">
             <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">${t('availableSizes') || 'Available Sizes'}</div>
             <div style="display:flex;gap:10px;flex-wrap:wrap;" id="lb-sizes-list">
               ${product.sizes.map((s, i) => `
                 <button type="button" aria-pressed="${i === this._selectedSizeIndex}" title="${escapeHtml(s.name||'')}" data-size-idx="${i}" onclick="productGallery.selectSize(${i})"
                      style="display:flex;align-items:center;gap:6px;cursor:pointer;
                      background:rgba(56,189,248,.06);border:1px solid ${i === this._selectedSizeIndex ? 'var(--accent)' : 'var(--glass-border)'};border-radius:20px;
                      padding:4px 12px;transition:border-color .15s;">
                   <span style="font-size:12px;color:var(--muted);">${escapeHtml(s.name)}${Number.isFinite(parseFloat(s.price)) ? ` — EGP ${parseFloat(s.price).toFixed(2)}` : ''}</span>
                 </button>`).join('')}
             </div>
             <div id="lb-size-error" style="display:none;color:#ff6b6b;font-size:12px;margin-top:8px;">⚠ Please choose a size before adding to cart.</div>
           </div>`
        : '';
      document.getElementById('lb-info').innerHTML = `
        <div class="product-detail-primary">
        <div class="lb-tag">${escapeHtml(getProductCategories(product).join(' · '))} · ${escapeHtml(product.class)}</div>
        <div class="lb-name" id="lb-name">${escapeHtml(product.name)}</div>
        <div class="lb-price" id="lb-price">${priceHTML}</div>
        ${descHTML}
        ${colorsHTML}
        ${sizesHTML}
        <div class="product-facts" aria-label="Product fulfilment details">
          <div class="product-fact">Production<strong>3D printed</strong></div>
          <div class="product-fact">Finish<strong>Hand inspected</strong></div>
          <div class="product-fact">Delivery<strong>3–7 business days</strong></div>
        </div>
        <button onclick="productGallery.addToCart()"
          style="width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
                 color:#fff;border:none;cursor:pointer;border-radius:3px;font-size:12px;
                 letter-spacing:.15em;text-transform:uppercase;font-family:var(--font-body);transition:opacity .2s;"
          data-hover-over="opacity=.85" data-hover-out="opacity=1">
          ${t('addToCart')}
        </button>
        </div>`;

      this._renderMain();
      this._renderThumbs();

      this._previousFocus = document.activeElement;
      const el = document.getElementById('product-lightbox');
      el.style.display = 'flex';
      el.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => el.classList.add('open'));
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(() => {
        const closeButton = el.querySelector('.lightbox-close');
        if (closeButton) closeButton.focus();
      });
    },

    _renderMain() {
      const el = document.getElementById('lb-main');
      const src = this._allImages[this._current];
      el.innerHTML = src === '__SVG__'
        ? `<div style="width:60%;height:60%;display:flex;align-items:center;justify-content:center;">${getSVG(this._product)}</div>`
        : productImageMarkup(src, `${this._product.name} — image ${this._current + 1}`, {
            width: 960,
            sizes: '(max-width:700px) 92vw, 62vw',
            loading: 'eager',
            fit: 'contain'
          });
      this._syncNavigation();
    },

    _syncNavigation() {
      const hasMultiple = this._allImages.length > 1;
      const previousButton = document.getElementById('lb-prev');
      const nextButton = document.getElementById('lb-next');
      const counter = document.getElementById('lb-counter');
      if (previousButton) previousButton.hidden = !hasMultiple;
      if (nextButton) nextButton.hidden = !hasMultiple;
      if (counter) {
        counter.hidden = !hasMultiple;
        counter.textContent = hasMultiple ? `${this._current + 1} / ${this._allImages.length}` : '';
      }
    },

    _renderThumbs() {
      const el = document.getElementById('lb-thumbs');
      if (this._allImages.length <= 1) { el.innerHTML = ''; return; }
      el.innerHTML = this._allImages.map((url, i) => `
        <button type="button" class="lightbox-thumb${i === this._current ? ' active' : ''}" aria-current="${i === this._current}" aria-label="Show image ${i + 1} of ${escapeHtml(this._product.name)}" onclick="productGallery.select(${i})">
          ${url === '__SVG__' ? getSVG(this._product) : productImageMarkup(url, `Thumbnail ${i + 1} for ${this._product.name}`, { width: 160, sizes: '80px' })}
        </button>`).join('');
    },

    select(index) {
      const imageCount = this._allImages.length;
      if (!imageCount) return;
      this._current = (index + imageCount) % imageCount;
      this._renderMain();
      document.querySelectorAll('.lightbox-thumb').forEach((t, i) => {
        const isCurrent = i === this._current;
        t.classList.toggle('active', isCurrent);
        t.setAttribute('aria-current', String(isCurrent));
      });
    },

    previous() {
      if (this._allImages.length > 1) this.select(this._current - 1);
    },

    next() {
      if (this._allImages.length > 1) this.select(this._current + 1);
    },

    selectColor(index) {
      this._selectedColorIndex = index;
      document.querySelectorAll('#lb-colors-list [data-color-idx]').forEach(el => {
        const selected = parseInt(el.dataset.colorIdx, 10) === index;
        el.style.borderColor = selected ? 'var(--accent)' : 'var(--glass-border)';
        el.setAttribute('aria-pressed', String(selected));
      });
      const errEl = document.getElementById('lb-color-error');
      if (errEl) errEl.style.display = 'none';
    },

    selectSize(index) {
      this._selectedSizeIndex = index;
      document.querySelectorAll('#lb-sizes-list [data-size-idx]').forEach(el => {
        const selected = parseInt(el.dataset.sizeIdx, 10) === index;
        el.style.borderColor = selected ? 'var(--accent)' : 'var(--glass-border)';
        el.setAttribute('aria-pressed', String(selected));
      });
      const errEl = document.getElementById('lb-size-error');
      if (errEl) errEl.style.display = 'none';
      // Sizes are priced as standalone SKUs, so picking one replaces the
      // displayed price entirely rather than adjusting the base price.
      const product = this._product;
      const size = product && product.sizes ? product.sizes[index] : null;
      const priceEl = document.getElementById('lb-price');
      if (priceEl && size && Number.isFinite(parseFloat(size.price))) {
        priceEl.innerHTML = `<strong>EGP ${parseFloat(size.price).toFixed(2)}</strong>`;
      }
    },

    addToCart() {
      const product = this._product;
      if (!product) return;
      if (product.colors && product.colors.length && this._selectedColorIndex == null) {
        const errEl = document.getElementById('lb-color-error');
        if (errEl) errEl.style.display = 'block';
        const colors = document.getElementById('lb-colors');
        if (colors) colors.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (product.sizes && product.sizes.length && this._selectedSizeIndex == null) {
        const errEl = document.getElementById('lb-size-error');
        if (errEl) errEl.style.display = 'block';
        const sizes = document.getElementById('lb-sizes');
        if (sizes) sizes.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      const selectedColor = (product.colors && this._selectedColorIndex != null)
        ? product.colors[this._selectedColorIndex]
        : null;
      const selectedSize = (product.sizes && this._selectedSizeIndex != null)
        ? product.sizes[this._selectedSizeIndex]
        : null;
      cartApp.add(product, selectedColor, selectedSize);
      this.close();
    },

    close() {
      const el = document.getElementById('product-lightbox');
      el.classList.remove('open');
      el.setAttribute('aria-hidden', 'true');
      setTimeout(() => { el.style.display = 'none'; }, 300);
      document.body.style.overflow = '';
      if (this._previousFocus && typeof this._previousFocus.focus === 'function') this._previousFocus.focus();
    }
  };

  // Close on backdrop click
  document.getElementById('product-lightbox').addEventListener('click', function(e) {
    if (e.target === this) productGallery.close();
  });
  document.addEventListener('keydown', event => {
    const lightboxOpen = document.getElementById('product-lightbox').classList.contains('open');
    if (!lightboxOpen) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      productGallery.close();
    } else if (event.key === 'ArrowLeft') {
      event.preventDefault();
      productGallery.previous();
    } else if (event.key === 'ArrowRight') {
      event.preventDefault();
      productGallery.next();
    }
  });
</script>

</body>
</html>
